name: Cloudflare Clerk Cutover
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  VELVET_SESSION_BRIDGE_SECRET: ${{ secrets.VELVET_SESSION_BRIDGE_SECRET }}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  PRODUCTION_URL: https://velvet.karukimori.workers.dev
  E2E_WORKSPACE_ID: ws_velvet_e2e
  E2E_USER_ID: user_velvet_e2e
jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Require production configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$VELVET_SESSION_BRIDGE_SECRET"
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          test -n "$CLERK_SECRET_KEY"
          case "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" in pk_*) ;; *) echo "Invalid Clerk publishable key shape" >&2; exit 1;; esac
          case "$CLERK_SECRET_KEY" in sk_*) ;; *) echo "Invalid Clerk secret key shape" >&2; exit 1;; esac
      - name: Verify repository checks
        run: |
          npm run typecheck
          npm run check:responsibility
          npm run check:message-draft
          npm run check:recall
          npm run check:memory-inputs
          npm run check:repeat-visits
          npm run check:mobile-ux
          npm run check:feedback-hub
          npm run check:plan-enforcement
          npm run check:media-access
      - name: Verify Cloudflare identity
        run: npx wrangler whoami
      - name: Resolve Velvet D1 database
        run: |
          npx wrangler d1 list --json > /tmp/d1-list.json
          DB_ID=$(node -e 'const fs=require("fs");const list=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));const db=list.find(x=>x.name==="velvet");process.stdout.write(db?.uuid??db?.id??"")')
          test -n "$DB_ID"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
          node -e 'const fs=require("fs");const p="wrangler.jsonc";const s=fs.readFileSync(p,"utf8").replace("00000000-0000-0000-0000-000000000000",process.argv[1]);fs.writeFileSync(p,s)' "$DB_ID"
      - name: Build Clerk-enabled Worker
        run: npm run cf:build
      - name: Deploy Clerk-enabled Worker
        run: npx wrangler deploy
      - name: Configure runtime auth secrets
        run: |
          put_secret() {
            local name="$1" value="$2"
            for attempt in 1 2 3; do
              if printf '%s' "$value" | npx wrangler secret put "$name"; then return 0; fi
              if [ "$attempt" -eq 3 ]; then echo "Failed to configure $name after 3 attempts" >&2; return 1; fi
              sleep $((attempt * 5))
            done
          }
          put_secret VELVET_SESSION_BRIDGE_SECRET "$VELVET_SESSION_BRIDGE_SECRET"
          put_secret NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          put_secret CLERK_SECRET_KEY "$CLERK_SECRET_KEY"
      - name: Verify signed-out public auth boundary
        run: |
          sleep 5
          AUTH_STATUS=$(curl --silent --output /tmp/auth.html --write-out '%{http_code}' "$PRODUCTION_URL/auth")
          test "$AUTH_STATUS" = "200"
          ROOT_STATUS=$(curl --silent --location-trusted --max-redirs 0 --output /tmp/root.html --write-out '%{http_code}' "$PRODUCTION_URL/" || true)
          case "$ROOT_STATUS" in 307|308|302|303) ;; *) echo "Expected signed-out redirect, got $ROOT_STATUS" >&2; exit 1;; esac
          API_STATUS=$(curl --silent --output /tmp/api.json --write-out '%{http_code}' "$PRODUCTION_URL/api/media/status")
          test "$API_STATUS" = "401"
          node -e 'const j=require("/tmp/api.json");if(j.code!=="AUTH_REQUIRED")throw new Error("Protected API did not return AUTH_REQUIRED")'
      - name: Verify trusted bridge survives Clerk cutover
        run: |
          curl --fail --silent --show-error "$PRODUCTION_URL/api/media/status" \
            -H "x-velvet-auth-bridge: $VELVET_SESSION_BRIDGE_SECRET" \
            -H "x-velvet-workspace-id: $E2E_WORKSPACE_ID" \
            -H "x-velvet-user-id: $E2E_USER_ID" \
            -H "x-velvet-owner-user-id: $E2E_USER_ID" \
            > /tmp/bridge.json
          node -e 'const j=require("/tmp/bridge.json");if(!j.status)throw new Error("Trusted bridge check failed")'
