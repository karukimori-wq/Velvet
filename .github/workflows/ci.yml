name: Velvet CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Responsibility boundary
        run: npm run check:responsibility
      - name: MessageDraft contract
        run: npm run check:message-draft
      - name: Recall policy
        run: npm run check:recall
      - name: Memory input convergence
        run: npm run check:memory-inputs
      - name: Repeat visit flow
        run: npm run check:repeat-visits
      - name: Mobile UX guard
        run: npm run check:mobile-ux
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
