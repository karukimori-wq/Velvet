name: Cloudflare Production
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  VELVET_SESSION_BRIDGE_SECRET: ${{ secrets.VELVET_SESSION_BRIDGE_SECRET }}
  PRODUCTION_URL: https://velvet.karukimori.workers.dev
  E2E_WORKSPACE_ID: ws_velvet_e2e
  E2E_USER_ID: user_velvet_e2e
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run check:responsibility
      - run: npm run check:message-draft
      - run: npm run check:recall
      - run: npm run check:memory-inputs
      - run: npm run check:repeat-visits
      - run: npm run check:mobile-ux
      - run: npm run check:feedback-hub
      - run: npm run check:plan-enforcement
      - run: npm run check:media-access
      - name: Require Cloudflare configuration
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$VELVET_SESSION_BRIDGE_SECRET"
      - name: Verify Cloudflare identity
        run: npx wrangler whoami
      - name: Ensure Velvet D1 database
        run: |
          npx wrangler d1 list --json > /tmp/d1-list.json
          DB_ID=$(node -e 'const fs=require("fs");const list=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));const db=list.find(x=>x.name==="velvet");process.stdout.write(db?.uuid??db?.id??"")')
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create velvet
            npx wrangler d1 list --json > /tmp/d1-list.json
            DB_ID=$(node -e 'const fs=require("fs");const list=JSON.parse(fs.readFileSync("/tmp/d1-list.json","utf8"));const db=list.find(x=>x.name==="velvet");process.stdout.write(db?.uuid??db?.id??"")')
          fi
          test -n "$DB_ID"
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
          node -e 'const fs=require("fs");const p="wrangler.jsonc";const s=fs.readFileSync(p,"utf8").replace("00000000-0000-0000-0000-000000000000",process.argv[1]);fs.writeFileSync(p,s)' "$DB_ID"
          npx wrangler d1 info velvet
      - name: Apply D1 schema
        run: npx wrangler d1 execute velvet --remote --file=cloudflare/schema.sql --yes
      - name: Seed Pro entitlement for production E2E
        run: |
          npx wrangler d1 execute velvet --remote --yes --command="INSERT INTO velvet_owner_entitlements(owner_user_id,plan,status,updated_at) VALUES ('$E2E_USER_ID','pro','active',strftime('%Y-%m-%dT%H:%M:%fZ','now')) ON CONFLICT(owner_user_id) DO UPDATE SET plan='pro',status='active',updated_at=excluded.updated_at;"
      - name: Build OpenNext Worker
        run: npm run cf:build
      - name: Deploy Worker
        run: npx wrangler deploy
      - name: Configure production auth secret
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "$VELVET_SESSION_BRIDGE_SECRET" | npx wrangler secret put VELVET_SESSION_BRIDGE_SECRET; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to configure production auth secret after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Verify public production endpoints
        run: |
          sleep 5
          curl --fail --silent --show-error "$PRODUCTION_URL/health" | tee /tmp/health.json
          curl --fail --silent --show-error "$PRODUCTION_URL/version" | tee /tmp/version.json
          curl --fail --silent --show-error "$PRODUCTION_URL/contracts/status" | tee /tmp/contracts.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/persistence/status" | tee /tmp/persistence.json
          node - <<'NODE'
          const fs=require('node:fs');
          const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const version=JSON.parse(fs.readFileSync('/tmp/version.json','utf8'));
          const contracts=JSON.parse(fs.readFileSync('/tmp/contracts.json','utf8'));
          const persistence=JSON.parse(fs.readFileSync('/tmp/persistence.json','utf8'));
          if(health.status!=='success'||health.appName!=='velvet')throw new Error('Velvet health failed');
          if(version.status!=='success'||version.appName!=='velvet')throw new Error('Velvet version failed');
          if(contracts.status!=='success'||contracts.professionalIdRequired!==false||contracts.usesLegacyEventNames===true)throw new Error('Velvet contract failed');
          if(persistence.status!=='success'||persistence.driver!=='d1'||persistence.d1Reachable!==true||persistence.databaseBackedPersistenceReady!==true)throw new Error('Velvet D1 readiness failed');
          NODE
      - name: Verify D1 roundtrip
        run: |
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/persistence/roundtrip" -H "x-velvet-auth-bridge: $VELVET_SESSION_BRIDGE_SECRET" -H "x-velvet-workspace-id: $E2E_WORKSPACE_ID" -H "x-velvet-user-id: $E2E_USER_ID" -H "x-velvet-owner-user-id: $E2E_USER_ID" | tee /tmp/roundtrip.json
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/roundtrip.json','utf8'));if(j.status!=='success'||j.persistenceDriver!=='d1'||j.roundtripReady!==true)throw new Error('Velvet D1 roundtrip failed')"
      - name: Verify customer memory D1 isolation
        run: |
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; CUSTOMER_ID="cust_velvet_e2e_$RUN_ID"
          AUTH=(-H "x-velvet-auth-bridge: $VELVET_SESSION_BRIDGE_SECRET" -H "x-velvet-workspace-id: $E2E_WORKSPACE_ID" -H "x-velvet-user-id: $E2E_USER_ID" -H "x-velvet-owner-user-id: $E2E_USER_ID")
          curl --fail --silent --show-error -X PATCH "$PRODUCTION_URL/api/customers/$CUSTOMER_ID/memory" -H 'content-type: application/json' "${AUTH[@]}" --data "{\"personalityNote\":\"Production E2E memory note $RUN_ID\",\"tags\":[\"production-e2e\"],\"pinned\":true}" | tee /tmp/memory-write.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/customers/$CUSTOMER_ID/memory" "${AUTH[@]}" | tee /tmp/memory-read.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/customers/$CUSTOMER_ID/memory" -H "x-velvet-auth-bridge: $VELVET_SESSION_BRIDGE_SECRET" -H 'x-velvet-workspace-id: ws_velvet_other' -H 'x-velvet-user-id: user_velvet_other' -H 'x-velvet-owner-user-id: user_velvet_other' | tee /tmp/memory-isolation.json
          node - <<'NODE'
          const fs=require('fs'),r=p=>JSON.parse(fs.readFileSync(p,'utf8')); const w=r('/tmp/memory-write.json'),m=r('/tmp/memory-read.json'),i=r('/tmp/memory-isolation.json'); if(w.status!=='success'||!w.memoryId||m.status!=='success'||!m.memory||m.memory.pinned!==true||i.status!=='success'||i.memory!==null)throw new Error('Velvet memory isolation failed');
          NODE
      - name: Verify Professional Memory production flow
        run: |
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; CUSTOMER_ID="cust_velvet_flow_$RUN_ID"
          AUTH=(-H "x-velvet-auth-bridge: $VELVET_SESSION_BRIDGE_SECRET" -H "x-velvet-workspace-id: $E2E_WORKSPACE_ID" -H "x-velvet-user-id: $E2E_USER_ID" -H "x-velvet-owner-user-id: $E2E_USER_ID")
          curl --fail --silent --show-error -X PATCH "$PRODUCTION_URL/api/customers/$CUSTOMER_ID/memory" -H 'content-type: application/json' "${AUTH[@]}" --data "{\"displayNameSnapshot\":\"E2E Customer $RUN_ID\",\"personalityNote\":\"calm\",\"tags\":[\"趣味：旅行\"]}" >/tmp/flow-memory.json
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/visits" -H 'content-type: application/json' "${AUTH[@]}" --data "{\"customerId\":\"$CUSTOMER_ID\",\"intent\":\"production-e2e\"}" >/tmp/flow-visit-start.json
          VISIT_ID=$(node -e 'const j=require("/tmp/flow-visit-start.json");process.stdout.write(j.visitId)')
          curl --fail --silent --show-error -X PATCH "$PRODUCTION_URL/api/visits/$VISIT_ID" -H 'content-type: application/json' "${AUTH[@]}" --data '{"seatingReason":"指名","conversationMemo":"Production E2E conversation","preferenceMemo":"旅行","nextActionMemo":"旅行の感想を聞く","summary":"Production E2E visit"}' >/tmp/flow-visit-update.json
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/customers/$CUSTOMER_ID/notes" -H 'content-type: application/json' "${AUTH[@]}" --data "{\"visitId\":\"$VISIT_ID\",\"title\":\"E2E Note\",\"note\":\"Production E2E professional note\"}" >/tmp/flow-note.json
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/visits/$VISIT_ID" -H 'content-type: application/json' "${AUTH[@]}" --data '{"action":"end"}' >/tmp/flow-visit-end.json
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/customers/$CUSTOMER_ID/next-actions" -H 'content-type: application/json' "${AUTH[@]}" --data '{"text":"Production E2E next action"}' >/tmp/flow-next-create.json
          NEXT_ID=$(node -e 'const j=require("/tmp/flow-next-create.json");process.stdout.write(j.nextActionId)')
          curl --fail --silent --show-error -X PATCH "$PRODUCTION_URL/api/customers/$CUSTOMER_ID/next-actions/$NEXT_ID" -H 'content-type: application/json' "${AUTH[@]}" --data '{"action":"complete"}' >/tmp/flow-next-complete.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/customers/$CUSTOMER_ID/memory" "${AUTH[@]}" >/tmp/flow-memory-read.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/visits/$VISIT_ID" "${AUTH[@]}" >/tmp/flow-visit-read.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/customers/$CUSTOMER_ID/next-actions" "${AUTH[@]}" >/tmp/flow-next-read.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/customers/$CUSTOMER_ID/timeline" "${AUTH[@]}" >/tmp/flow-timeline.json
          node - <<'NODE'
          const fs=require('fs'),r=p=>JSON.parse(fs.readFileSync(p,'utf8'));const m=r('/tmp/flow-memory-read.json'),v=r('/tmp/flow-visit-read.json'),n=r('/tmp/flow-next-read.json'),t=r('/tmp/flow-timeline.json');const c=n.items?.find(x=>x.text==='Production E2E next action'),types=new Set((t.entries??[]).map(x=>x.eventType));if(m.status!=='success'||!String(m.memory?.preferenceNote??'').includes('旅行')||v.status!=='success'||!v.visit?.endedAt||v.visit?.seatingReason!=='指名'||n.status!=='success'||!c||c.status!=='done'||!c.completedAt||t.status!=='success'||!types.has('visit')||!types.has('note')||!types.has('next_action'))throw new Error('Professional Memory production flow failed');
          NODE
      - name: Verify production media R2 flow
        run: |
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; CUSTOMER_ID="cust_velvet_media_$RUN_ID"
          AUTH=(-H "x-velvet-auth-bridge: $VELVET_SESSION_BRIDGE_SECRET" -H "x-velvet-workspace-id: $E2E_WORKSPACE_ID" -H "x-velvet-user-id: $E2E_USER_ID" -H "x-velvet-owner-user-id: $E2E_USER_ID")
          curl --fail --silent --show-error -X PATCH "$PRODUCTION_URL/api/customers/$CUSTOMER_ID/memory" -H 'content-type: application/json' "${AUTH[@]}" --data "{\"displayNameSnapshot\":\"Media E2E Customer $RUN_ID\",\"tags\":[\"media-e2e\"]}" >/tmp/media-memory.json
          curl --fail --silent --show-error "$PRODUCTION_URL/api/media/status" "${AUTH[@]}" >/tmp/media-status.json
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 --decode >/tmp/velvet-media-e2e.png
          curl --fail --silent --show-error -X POST "$PRODUCTION_URL/api/media/upload" "${AUTH[@]}" -F "customerId=$CUSTOMER_ID" -F "file=@/tmp/velvet-media-e2e.png;type=image/png;filename=e2e.png" >/tmp/media-upload.json
          MEDIA_KEY=$(node -e 'const j=require("/tmp/media-upload.json");if(j.status!=="success"||!j.media?.key)process.exit(1);process.stdout.write(j.media.key)')
          ENCODED_KEY=$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$MEDIA_KEY")
          curl --fail --silent --show-error "$PRODUCTION_URL/api/media/object?key=$ENCODED_KEY&customerId=$CUSTOMER_ID" "${AUTH[@]}" -o /tmp/media-object.bin -D /tmp/media-headers.txt
          WRONG_SCOPE_STATUS=$(curl --silent --output /tmp/media-wrong-scope.json --write-out '%{http_code}' "$PRODUCTION_URL/api/media/object?key=$ENCODED_KEY&customerId=other_customer" "${AUTH[@]}"); export WRONG_SCOPE_STATUS
          curl --fail --silent --show-error "$PRODUCTION_URL/api/customers/$CUSTOMER_ID/timeline" "${AUTH[@]}" >/tmp/media-timeline.json
          node - <<'NODE'
          const fs=require('fs'),r=p=>JSON.parse(fs.readFileSync(p,'utf8'));const s=r('/tmp/media-status.json'),u=r('/tmp/media-upload.json'),t=r('/tmp/media-timeline.json');const original=fs.readFileSync('/tmp/velvet-media-e2e.png'),retrieved=fs.readFileSync('/tmp/media-object.bin'),headers=fs.readFileSync('/tmp/media-headers.txt','utf8');const expected=`r2:${u.media?.key??''}`;const linked=(t.entries??[]).some(e=>e.eventType==='media'&&String(e.sourceRef??'')===expected);if(s.status!=='success'||!s.uploadReady||!s.retrievalReady||u.status!=='success'||u.eventName!=='velvet.media.uploaded.v1'||!u.media?.key||!original.equals(retrieved)||!headers.toLowerCase().includes('content-type: image/png')||process.env.WRONG_SCOPE_STATUS!=='403'||t.status!=='success'||!linked)throw new Error('Production media R2 flow failed');
          NODE
